<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labyrinthe Pathfinding</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        canvas { border: 1px solid black; }
        button { margin: 10px; }
    </style>
</head>
<body>
    <h1>Résolution de Labyrinthe avec Dijkstra et BFS</h1>
    <canvas id="mazeCanvas" width="500" height="500"></canvas>
    <br>
    <button id="generateBtn">Générer Labyrinthe</button>
    <button id="dijkstraBtn">Résoudre avec Dijkstra</button>
    <button id="bfsBtn">Résoudre avec BFS</button>
    <p id="status">Cliquez sur "Générer Labyrinthe" pour commencer.</p>

    <script src="../wasm/build/pathfinder.js?v=3"></script>
    <script>
        const canvas = document.getElementById('mazeCanvas');
        const ctx = canvas.getContext('2d');
        const cellSize = 50;
        const width = 10;
        const height = 10;

        let maze = [];
        let start = [0, 0];
        let end = [9, 9];
        let path = [];

        // Fonction pour dessiner le labyrinthe
        function drawMaze() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    if (maze[y][x] === 1) {
                        ctx.fillStyle = 'black';
                        ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
                    } else {
                        ctx.strokeRect(x * cellSize, y * cellSize, cellSize, cellSize);
                    }
                }
            }
            // Dessiner départ et arrivée
            ctx.fillStyle = 'green';
            ctx.fillRect(start[0] * cellSize, start[1] * cellSize, cellSize, cellSize);
            ctx.fillStyle = 'red';
            ctx.fillRect(end[0] * cellSize, end[1] * cellSize, cellSize, cellSize);
            // Dessiner le chemin
            if (path.length > 0) {
                ctx.strokeStyle = 'blue';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(path[0].x * cellSize + cellSize / 2, path[0].y * cellSize + cellSize / 2);
                for (let i = 1; i < path.length; i++) {
                    ctx.lineTo(path[i].x * cellSize + cellSize / 2, path[i].y * cellSize + cellSize / 2);
                }
                ctx.stroke();
            }
        }

        // Générer un labyrinthe aléatoire
        function generateMaze() {
            maze = Array.from({ length: height }, () => Array(width).fill(0));
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    if ((x === start[0] && y === start[1]) || (x === end[0] && y === end[1])) continue;
                    if (Math.random() < 0.3) maze[y][x] = 1; // 30% chance d'être un mur
                }
            }
            drawMaze();
            document.getElementById('status').textContent = 'Labyrinthe généré. Choisissez un algorithme.';
        }

        // Charger WebAssembly
        PathfinderModule().then(Module => {
            document.getElementById('generateBtn').addEventListener('click', generateMaze);

            document.getElementById('dijkstraBtn').addEventListener('click', () => {
                const walls = [];
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        if (maze[y][x] === 1) {
                            walls.push(x, y);
                        }
                    }
                }
                path = Module.dijkstraPath(width, height, walls, start[0], start[1], end[0], end[1]);
                drawMaze();
                document.getElementById('status').textContent = `Chemin trouvé avec Dijkstra : ${path.length} étapes.`;
            });

            document.getElementById('bfsBtn').addEventListener('click', () => {
                const walls = [];
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        if (maze[y][x] === 1) {
                            walls.push(x, y);
                        }
                    }
                }
                path = Module.bfsPath(width, height, walls, start[0], start[1], end[0], end[1]);
                drawMaze();
                document.getElementById('status').textContent = `Chemin trouvé avec BFS : ${path.length} étapes.`;
            });
        }).catch(err => {
            document.getElementById('status').textContent = 'Erreur de chargement WebAssembly : ' + err;
        });
    </script>
</body>
</html>
