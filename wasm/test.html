<!DOCTYPE html>
<html>
<head>
    <title>Test Pathfinding</title>
</head>
<body>
<h1>Test Dijkstra & BFS</h1>
<script src="build/pathfinder.js"></script>
<script>
PathfinderModule().then(Module => {

    const width = 5;
    const height = 5;
    const walls = [[1,1],[1,2],[1,3]];
    const start = [0,0];
    const end = [4,4];

    const dijkstraPath = Module.dijkstraPath(width, height, walls, start, end);
    console.log("Dijkstra Path:", dijkstraPath);

    const bfsPath = Module.bfsPath(width, height, walls, start, end);
    console.log("BFS Path:", bfsPath);

});
</script>
</body>
</html>
